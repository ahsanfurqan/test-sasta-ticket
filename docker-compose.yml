name: meter

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meter}
      POSTGRES_DB: ${POSTGRES_DB:-meter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meter} -d ${POSTGRES_DB:-meter}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # appendonly buys durability Redis is not being trusted for anyway (it is a cache and
    # a buffer, never the system of record) -- but it makes local restart behaviour less
    # surprising while developing.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./loadtest:/app/loadtest
      # config only (ruff, pytest, import-linter); dep changes still need a rebuild
      - ./pyproject.toml:/app/pyproject.toml
    command:
      ["uvicorn", "meter.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: ["python", "-m", "meter.pipeline.worker"]

volumes:
  postgres_data:
  redis_data:
